<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link
	rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@latest/gray.css"
    />
    <script src="scripts.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="sidebar">
        <h1>My Library</h1>
        <p><span class="welcomeMSG">Welcome to the library!</span> Here you'll find a collection of books you've read, or intend to read.</p>

        <button id="addBook">Add Book</button>

        <h1>Stats</h1>
        <table>
            <tr>
                <th>Stat</th>
                <th>Value</th>
            </tr>
            <tr>
                <th>Total # of books</th>
                <td><span id="bookCount"></span></td>
            </tr>
            <tr>
                <th>Total # of pages</th>
                <td><span id="pageCount"></span></td>
            </tr>
            <tr>
                <th>Average book length</th>
                <td><span id="averagePages"></span></td>
            </tr>
            <tr>
                <th>Unique Authors</th>
                <td><span id="uniqueAuthors"></span></td>
            </tr>
        </table>
    </div>

    <div class="bookshelf"></div>
</body>
</html>
